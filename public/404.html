<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aether TV — Premium Live TV, Sports & Cinema in USA, UK & Canada</title>
    <meta name="description" content="Experience 20,000+ live channels, 60,000+ VOD movies and 4K sports streaming across the USA, UK and Canada. Zero buffering, 99.9% uptime." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // Redirects any 404 to index.html with route preserved in query string or hash
      var pathSegmentsToKeep = 0;
      var l = window.location;
      if (l.search.indexOf('/') === 1) {
        var decoded = l.slice(1).split('&').map(function(s) { return s.replace(/~and~/g, '&') }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
